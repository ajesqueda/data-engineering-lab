<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 546" width="860" height="546" role="img" aria-label="A schema-starter session in a terminal">
<style>
  text { font: 13.5px ui-monospace, 'SF Mono', Menlo, Consolas, monospace; white-space: pre; fill: #a1a1a6; }
  .l { opacity: 0; animation: show .01s linear forwards; }
  .a { fill: #64d2ff; } .p { fill: #bf5af2; } .c { fill: #f5f5f7; }
  .ok { fill: #30d158; }
  @keyframes show { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .l { animation: none; opacity: 1; } }
</style>
<rect width="860" height="546" rx="14" fill="#1d1d1f"/>
<path d="M0 14 a14 14 0 0 1 14 -14 h832 a14 14 0 0 1 14 14 v24 h-860 z" fill="#2c2c2e"/>
<circle cx="22" cy="19" r="6.5" fill="#ff5f57"/>
<circle cx="44" cy="19" r="6.5" fill="#febc2e"/>
<circle cx="66" cy="19" r="6.5" fill="#28c840"/>
<text x="430.0" y="23" text-anchor="middle" style="font: 12.5px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif; fill: #8e8e93">schema-starter — zsh</text>
<text class="l" x="24" y="62" style="animation-delay:1.30s"><tspan class="p">$ </tspan><tspan class="c">python -m schema_starter init</tspan></text>
<text class="l" x="24" y="84" style="animation-delay:1.65s">What's the business called?</text>
<text class="l" x="24" y="106" style="animation-delay:2.15s"><tspan class="p">› </tspan><tspan class="a">Corner Bakery</tspan></text>
<text class="l" x="24" y="128" style="animation-delay:2.50s">What things does the business keep track of?</text>
<text class="l" x="24" y="150" style="animation-delay:3.00s"><tspan class="p">› </tspan><tspan class="a">customer, product, Order</tspan></text>
<text class="l" x="24" y="172" style="animation-delay:3.35s">  'Order' will be called 'customer_order'</text>
<text class="l" x="24" y="194" style="animation-delay:3.70s">What do you record about each customer?</text>
<text class="l" x="24" y="216" style="animation-delay:4.20s">  <tspan class="p">› </tspan><tspan class="a">full_name text required</tspan></text>
<text class="l" x="24" y="238" style="animation-delay:4.70s">  <tspan class="p">› </tspan><tspan class="a">email email required unique</tspan></text>
<text class="l" x="24" y="260" style="animation-delay:5.20s">  <tspan class="p">› </tspan><tspan class="a">phone text many</tspan></text>
<text class="l" x="24" y="282" style="animation-delay:5.55s">Does each customer_order belong to one of these? customer, product</text>
<text class="l" x="24" y="304" style="animation-delay:6.05s"><tspan class="p">› </tspan><tspan class="a">customer</tspan></text>
<text class="l" x="24" y="326" style="animation-delay:6.40s">  If a customer is deleted, what happens to its customer_orders? <tspan class="a">b</tspan> (block the delete)</text>
<text class="l" x="24" y="348" style="animation-delay:6.75s">Which things pair up many-to-many?</text>
<text class="l" x="24" y="370" style="animation-delay:7.25s"><tspan class="p">› </tspan><tspan class="a">order-product</tspan></text>
<text class="l" x="24" y="392" style="animation-delay:7.60s">What do you record about each customer_order-product pair?</text>
<text class="l" x="24" y="414" style="animation-delay:8.10s">  <tspan class="p">› </tspan><tspan class="a">quantity count required</tspan></text>
<text class="l" x="24" y="436" style="animation-delay:8.60s">  <tspan class="p">› </tspan><tspan class="a">unit_price money required</tspan></text>
<text class="l" x="24" y="458" style="animation-delay:9.10s"><tspan class="ok">wrote corner_bakery.json</tspan></text>
<text class="l" x="24" y="480" style="animation-delay:10.10s"><tspan class="p">$ </tspan><tspan class="c">python -m schema_starter deploy corner_bakery.json --db shop</tspan></text>
<text class="l" x="24" y="502" style="animation-delay:10.60s"><tspan class="ok">created schema corner_bakery with 5 tables; diagram in corner_bakery-erd.md</tspan></text>
</svg>
